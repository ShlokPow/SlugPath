name: Release
on:
  push:
    tags: ['v*']
jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cd apps/extension/dist && zip -r ../../../slugpath-extension-${{ github.ref_name }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: slugpath-extension-${{ github.ref_name }}
          path: slugpath-extension-${{ github.ref_name }}.zip
