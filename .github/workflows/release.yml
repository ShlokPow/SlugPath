name: Release
on:
  push:
    tags: ['v*']
jobs:
  build-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check tag matches package version
        run: test "${{ github.ref_name }}" = "v$(node -p "require('./apps/extension/package.json').version")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        # Google Calendar export's OAuth client id (manifest.config.ts). A
        # repo without the secret set still builds — the manifest keeps the
        # REPLACE_ME placeholder and only calendar export is non-functional.
        env:
          SLUGPATH_OAUTH_CLIENT_ID: ${{ secrets.SLUGPATH_OAUTH_CLIENT_ID }}
      - run: cd apps/extension/dist && zip -r ../../../slugpath-extension-${{ github.ref_name }}.zip .
      - run: gh release create "${{ github.ref_name }}" slugpath-extension-${{ github.ref_name }}.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
